name: SuperAgent Desktop

# Builds the desktop shell for the three platforms and, when asked, publishes the
# installers as a prerelease of this repository's own fork. Nothing here publishes
# a SuperAgent runtime release: the shell attaches to the runtime installed on the
# machine, and its installers only carry the shell.
#
#   Windows  x64   NSIS setup .exe (choose the program directory, per user)
#   macOS    arm64 disk image (drag into Applications)
#   macOS    x64   disk image
#   Linux    x64   .deb + portable .tar.gz with an install script

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a prerelease with the installers"
        type: boolean
        default: true
  push:
    branches: ["feat/ovsa-desktop"]
    paths:
      - "superagent/desktop/**"
      - ".github/workflows/superagent-desktop.yml"

permissions:
  contents: read

env:
  DESKTOP_VERSION: "0.1.0"
  GO_VERSION: "1.23.4"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: superagent/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test and build
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...
          go build -trimpath -ldflags "-s -w" -o "${{ runner.temp }}\windows\ovsa-desktop.exe" .
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DVERSION=$env:DESKTOP_VERSION `
            /DSOURCE="${{ runner.temp }}\windows\ovsa-desktop.exe" `
            packaging\windows\installer.nsi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-win32-x64
          path: superagent/desktop/ovsa-desktop-*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: superagent/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test and build
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./...
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/bin/ovsa-desktop" .
      - name: Build the disk image
        run: |
          sh packaging/macos/build-dmg.sh "$RUNNER_TEMP/bin/ovsa-desktop" "$DESKTOP_VERSION" "$GITHUB_WORKSPACE/desktop-dist" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-darwin-${{ matrix.arch }}
          path: desktop-dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: superagent/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: System webview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test and build
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./...
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/bin/ovsa-desktop" .
      - name: Build the packages
        run: |
          sh packaging/linux/build-deb.sh "$RUNNER_TEMP/bin/ovsa-desktop" "$DESKTOP_VERSION" "$GITHUB_WORKSPACE/desktop-dist"
          ls -l "$GITHUB_WORKSPACE/desktop-dist"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          path: |
            desktop-dist/*.deb
            desktop-dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the installers
    needs: [windows, macos, linux]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List the artifacts
        run: find dist -type f -maxdepth 2 -exec ls -lh {} \;
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v${{ env.DESKTOP_VERSION }}
        run: |
          set -eu
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          cat > notes.md <<'NOTES'
          Desktop shell for OpenViking SuperAgent: one window that opens the console
          of the SuperAgent installed on this machine, and a first-run path that runs
          the official installer and setup when it is missing.

          The shell carries no runtime. It reads `~/.ov-superagent`, starts the
          installed release with the same `ov-superagent start` a terminal uses, and
          opens `http://127.0.0.1:3737/console` (the message timeline on releases
          that predate the console).

          | Platform | File | Install |
          | --- | --- | --- |
          | Windows 10/11 x64 | `ovsa-desktop-…-setup.exe` | run it, choose the program folder |
          | macOS arm64 / x64 | `ovsa-desktop-…-darwin-*.dmg` | open it, drag the app into Applications |
          | Debian/Ubuntu x64 | `ovsa-desktop_…_amd64.deb` | `sudo apt install ./…deb` |
          | other Linux x64 | `ovsa-desktop-…-linux-x64.tar.gz` | `./install.sh /your/path` |

          macOS builds here are ad-hoc signed, not notarized: right-click the app and
          choose Open the first time, or `xattr -d com.apple.quarantine` it.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "OpenViking SuperAgent Desktop $TAG" --notes-file notes.md dist/*
